<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>
</head>

<body>

  <!-- Navigation Start -->
  <div id="nav-placeholder"></div>

  <script>
    fetch("../nav.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;

        // Attach popup event listeners AFTER nav loads
        const openBtn = document.getElementById("openContactPopup");
        const openBtnMobile = document.getElementById("openContactPopupMobile");
        const closeBtn = document.getElementById("closeContactPopup");
        const popup = document.getElementById("contactPopup");

        // Desktop button
        if (openBtn) {
          openBtn.addEventListener("click", function(e) {
            e.preventDefault();
            popup.style.display = "flex";
          });
        }

        // Mobile button — close dropdown first
        if (openBtnMobile) {
          openBtnMobile.addEventListener("click", function(e) {
            e.preventDefault();
            const mobileNav = document.getElementById("mobileNav");
            if (mobileNav) mobileNav.style.display = "none";
            popup.style.display = "flex";
          });
        }

        // Close popup
        if (closeBtn) {
          closeBtn.addEventListener("click", function() {
            popup.style.display = "none";
          });
        }

        // Hamburger menu
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const mobileNav = document.getElementById("mobileNav");

        if (hamburgerBtn) {
          hamburgerBtn.addEventListener("click", () => {
            mobileNav.style.display =
              mobileNav.style.display === "block" ? "none" : "block";
          });
        }
      });
  </script>
  <!-- Navigation End -->
  <div class="popup-overlay" id="contactPopup">
  </div>

</body>
</html>
