<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wedding Questionnaire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body class="questionnaire-page">

  <div class="form-wrapper">

    <form id="weddingForm">

      <!-- FIRST SCREEN -->
      <div class="step active" data-step="start">
        <h1 class="intro-title">Let’s get to know your day!</h1>
        <p class="intro-subtitle">
          Answer a few quick questions so I can understand your wedding vision.
        </p>

        <button type="button" class="startBtn">Let’s get started</button>
      </div>

      <!-- NEXT QUESTION -->
      <div class="step" data-step="1">
        <h2 class="step-title">I want to get your titles right!</h2>
    
        <label for="roleSelect" class="question">How do you identify as a couple?</label>
        <select name="Role" id="roleSelect" required>
          <option value="">Select one</option>
          <option value="Bride-Groom">Bride + Groom</option>
          <option value="Bride-Bride">Bride + Bride</option>
          <option value="Groom-Groom">Groom + Groom</option>
          <option value="Partner-Non-Binary">Partners/Non-Binary</option>
        </select>
      </div>
      

    </form>

  </div>

  <!-- Corrected script path -->
  <script src="../questionnaire.js"></script>
</body>
</html>
