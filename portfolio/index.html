<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Portfolio Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* 1. Global Reset to ensure no browser default styles interfere */
    body {
      margin: 0;
      padding: 0;
      background-color: #fdfdfd;
    }

    /* 2. The Menu Container: Forces Centering */
    .isolated-portfolio-menu {
      /* Layout: Centers buttons horizontally */
      display: flex;
      justify-content: center; 
      align-items: center;
      flex-wrap: wrap;        /* Allows buttons to wrap on small screens */
      gap: 30px;              /* Space between buttons */

      /* Positioning: Makes bar full width so center is accurate */
      width: 100%;            
      margin: 60px 0;         /* Space above and below the menu */
      padding-bottom: 15px;
      
      /* Visuals */
      border-bottom: 1px solid #e5e5e5;
      font-family: 'Montserrat', sans-serif;
    }

    /* 3. Style for individual buttons */
    .menu-item {
      background: none;
      border: none;
      padding: 8px 0;
      cursor: pointer;
      
      /* Typography */
      color: #444;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      
      /* Interaction */
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent; /* Hidden underline */
    }

    .menu-item:hover {
      color: #000;
    }

    /* 4. The 'Active' state (Solid underline) */
    .menu-item.active {
      color: #000;
      border-bottom: 2px solid #000;
    }
  </style>
</head>
<body>

  <nav class="isolated-portfolio-menu">
    <button class="menu-item active" data-filter="all">ALL</button>
    <button class="menu-item" data-filter="couples">COUPLES</button>
    <button class="menu-item" data-filter="family">FAMILY</button>
    <button class="menu-item" data-filter="seniors">SENIORS + GRADS</button>
    <button class="menu-item" data-filter="weddings">WEDDINGS</button>
  </nav>

</body>
</html>
